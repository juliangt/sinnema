# Proyecto "Plata con Cabeza": alfabetización financiera para Gen Z.
# Tendencia: el contenido de finanzas personales es de los de mayor crecimiento
# y guardado/compartido en corto vertical; audiencia que llega por la inflación
# y las apps de inversión y se queda por las series progresivas.

[proyecto]
id = "finanzas"
marca = "Plata con Cabeza"
concepto = "micro-videos de educación financiera vertical de 60 segundos"
tema_por_defecto = "Cómo pasar de cero ahorros a tu primer fondo de emergencia"
idioma = "Español neutro latinoamericano"

[voz]
audiencia = "Jóvenes de 18 a 28 años en Latinoamérica que empiezan a ganar su primer sueldo, usan apps de banco e inversión y sienten que la plata no les alcanza"
contexto_cultural = "Español latinoamericano; inflación y monedas locales (peso, sol, bolívar), la mesa familiar donde el dinero es tabú, las apps financieras, el discurso de abundancia de las redes"
tono = "hermano mayor que ya cometió los errores: directo, sin tecnicismos innecesarios y cero promesas de hacerte rico"
guia_de_estilo = "Mundo fintech isométrico 3D con monedas, gráficas y billeteras; formato vertical 9:16; 130-150 palabras narradas por capítulo; 6-8 escenas por video; duración objetivo 60 s"
restricciones = "Ninguna recomendación de inversión ni promesa de rentabilidad; cada cifra o mecanismo financiero debe ser verificable; cada capítulo se apoya en el anterior sin repetir conceptos ya cubiertos"

[visual]
estilo_maestro = "Clean 3D isometric fintech world, vertical 9:16 framing, floating coins, wallets and growth charts, soft studio lighting, trustworthy teal and gold palette, subtle grid floor, rounded minimalist props, high detail, no text baked into the image"

# Sobre de 60 s estándar; el score de aprobación sube a 8 porque hablar de
# dinero exige más rigor que el promedio.
[formato]
relacion_de_aspecto = "9:16"
palabras_objetivo = [130, 150]
palabras_duras = [100, 200]
escenas = [6, 8]
duracion_escena_segundos = [2.0, 15.0]
duracion_total_objetivo_segundos = [55.0, 65.0]
duracion_total_dura_segundos = [45.0, 75.0]
palabras_por_escena_max = 45
texto_en_pantalla_max_palabras = 6
score_minimo_aprobacion = 8
