[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinnema"
version = "0.1.0"
description = "Motor multi-proyecto que genera series de micro-videos verticales mediante un pipeline multi-agente de LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Julián Garcia Tuñón" }]
keywords = ["llm", "langgraph", "video", "generacion", "multi-agente"]

dependencies = [
    "pydantic>=2.7,<3.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.1",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "python-dotenv>=1.0.0",
    "tomli-w>=1.0,<2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
media = [
    "google-genai>=1.0,<2.0",
    "openai>=1.50,<2.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "sinnema[server]",
]

[project.scripts]
sinnema = "sinnema.infrastructure.cli.main:main"
sinnema-server = "sinnema.infrastructure.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["sinnema"]

# Los shows de ejemplo viajan dentro de la wheel para que `pip install sinnema`
# funcione sin clonar el repositorio.
[tool.hatch.build.targets.wheel.force-include]
"proyectos" = "sinnema/proyectos"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
