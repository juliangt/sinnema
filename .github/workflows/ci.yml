# CI de Sinnema (spec-red-3d §13/§8c): suite backend y frontend, solo bajo demanda.
name: CI

on:
  workflow_dispatch:

jobs:
  backend:
    name: pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --extra dev
      - name: Suite backend
        run: uv run pytest -q

  frontend:
    name: vitest + lint + build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Suite frontend
        run: npm test
      - name: Build
        run: npm run build
